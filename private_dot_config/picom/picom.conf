
# =========================
# Picom config for Xmonad
# Rounded corners, shadows, negative space
# =========================

# Backend and experimental features
backend = "glx";
experimental-backends = true;
paint-on-overlay = false;

# Window corners
round-borders = 0;          # enable rounded borders
corner-radius = 0;          # radius in pixels

# Shadows
shadow = true;
shadow-radius = 12;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-opacity = 0.35;

# Negative space around windows (gaps)
# Picom doesn't handle gaps directly; use Xmonad spacing instead:
# Example in Xmonad: spacingRaw True (Border 6 6 6 6) True (Border 6 6 6 6) True

# Transparency
inactive-opacity = 0.9;     # slightly transparent inactive windows
active-opacity = 1.0;       # fully opaque active windows
frame-opacity = 0.8;        # for borders if supported

# Exclusions
shadow-exclude = [
  "class_g = 'Polybar'",
  "class_g = 'XTerm'",
  "class_g = 'URxvt'"
];

# Fade windows (optional)
fading = true;
fade-delta = 4;
fade-in-step = 0.03;
fade-out-step = 0.03;

# Opacity rule example (optional)
opacity-rule = [
  "90:class_g = 'Alacritty'"
];

# Other options
detect-client-opacity = true;
detect-transient = true;
detect-rounded-corners = true;
