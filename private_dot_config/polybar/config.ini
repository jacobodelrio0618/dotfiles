;==========================================================
; POLYBAR CONFIG - RESTRUCTURED FOR DUAL MONITORS
;==========================================================

[colors]
background = #000000
background-alt = #161616
foreground = #C5C8C6
primary = #F0C674
secondary = #8ABEB7
alert = #A54242
disabled = #707880
green = #009500
red = #f38ba8

[bar/mainbar]
# Use the MONITOR environment variable from the launch script
monitor = ${env:MONITOR:}

width = 100%
height = 24pt
radius = 0

background = ${colors.background}
foreground = ${colors.foreground}
 
line-size = 3pt
border-size = 4pt
border-color = #000000

padding-left = 0
padding-right = 1
module-margin = 1
separator = |
separator-foreground = ${colors.disabled}

font-0 = JetBrainsMono Nerd Font:size=10

modules-left = xworkspaces xwindow
modules-right = xkeyboard battery pulseaudio wlan eth date 

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

;==========================================================
; MODULES START HERE
;==========================================================

[module/xworkspaces]
type = internal/xworkspaces

; Keep workspaces pinned to their respective monitors
pin-workspaces = true

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-visible = %name%
label-visible-background = ${colors.background-alt}
label-visible-underline = ${colors.secondary}
label-visible-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/systray]
type = internal/tray
format-margin = 8pt
tray-spacing = 16pt

[module/xwindow]
format-prefix = "CF "
format-prefix-foreground = ${colors.primary}
type = internal/xwindow
label = %title:0:40:...%

[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>
label-volume = %percentage%%
label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock, caps lock
format-prefix = "KBD "
format-prefix-foreground = ${colors.primary}
label-layout = %layout%
label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected
format-connected-prefix = "CON "
format-connected-prefix-foreground = ${colors.primary}
format-disconnected-prefix = "CON "
format-disconnected-prefix-foreground = ${colors.primary}

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %essid%

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#F0C674}%ifname%%{F-}

[module/date]
type = internal/date
interval = 1
date = %d-%m-%Y
time = %H:%M
label = %{F#F0C674}%date%%{F-} %{F#C5C8C6}%time%%{F-}

[module/battery]
type = internal/battery
battery = BAT1
adapter = ACAD
poll-interval = 5
full-at = 99
low-at = 10

format-discharging-prefix = "BAT "
format-discharging-prefix-foreground = ${colors.primary}
format-charging-prefix = "BAT "
format-charging-prefix-foreground = ${colors.primary}
format-full-prefix = "BAT "
format-full-prefix-foreground = ${colors.primary}

format-charging = <label-charging>
format-discharging = <label-discharging>
format-full = <label-full>
format-low = <label-low>

label-charging = %percentage%%
label-charging-foreground = ${colors.green}
label-discharging = %percentage%%
label-full = Full
label-low = Low Battery 
label-low-foreground = ${colors.red}

[settings]
screenchange-reload = true
pseudo-transparency = true
