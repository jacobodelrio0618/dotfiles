# --- General ---
allow_remote_control yes
listen_on unix:/tmp/mykitty

# --- Font ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# Font Offsets
adjust_line_height  5
adjust_column_width 0

# Glyph Offsets
# Note: Kitty handles glyph alignment automatically, but you can 
# nudge the baseline if needed:
# modify_font baseline 2

# --- Window ---
# Kitty's padding is set in points. 
# "dynamic_padding" is default behavior when window size doesn't 
# perfectly match character cells.
window_padding_width 0
placement_strategy center

# Decorations
hide_window_decorations no
confirm_os_window_close 0

# Resize Increments
# This forces the window to resize in cell increments
resize_debounce_time 0.1
resize_draw_strategy static

# --- Colors ---
background #000000
